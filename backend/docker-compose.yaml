services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crmevent-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./data/crm.db
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      RESET_PASSWORD_EXPIRE_MINUTES: ${RESET_PASSWORD_EXPIRE_MINUTES:-30}
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
